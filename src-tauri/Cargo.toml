[package]
name = "typing-master-pro"
version = "1.0.0"
description = "Typing Master Pro - Offline Hindi & English Typing Tutor"
authors = ["Typing Master Pro Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
